name: iOS IPA Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: 🎉 iOS Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          architecture: x64

      - run: flutter pub get
        working-directory: sensorshubapp

      - run: pod repo update
        working-directory: sensorshubapp/ios

      - run: flutter build ios --release --no-codesign
        working-directory: sensorshubapp

      - run: mkdir Payload
        working-directory: sensorshubapp/build/ios/iphoneos

      - run: mv Runner.app/ Payload
        working-directory: sensorshubapp/build/ios/iphoneos

      - name: Zip output
        run: zip -qq -r -9 FlutterIpaExport.ipa Payload
        working-directory: sensorshubapp/build/ios/iphoneos

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlutterIpaExport
          path: sensorshubapp/build/ios/iphoneos/FlutterIpaExport.ipa